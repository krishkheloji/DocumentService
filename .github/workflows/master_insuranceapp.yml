name: Build and deploy ASP.Net Core app to Azure Web App - insuranceapp

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # ✅ Opt-in for Node 24

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5   # ✅ upgraded

      - name: Setup .NET
        uses: actions/setup-dotnet@v5   # ✅ upgraded
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore   # ✅ added (best practice)

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --output ./publish --no-build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./app   # ✅ explicit path

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_60D02A06C56648AFB135E097E89BF998 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_1BFA91F03B544250BA5B9AD2E35311F0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E8D4ACED26C64ACFA8596CB0D3F7D2EF }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'insuranceapp'
          slot-name: 'Production'
          package: ./app   # ✅ correct deployment path
